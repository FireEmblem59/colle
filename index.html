          for (let w = 1; w <= 17; w++) {
            const collesOfW = scheduleRaw.filter(
              (item) => item.weeks[w - 1] === group,
            );

            let collesHTML = "";
            if (collesOfW.length === 0) {
              collesHTML = `<p class="text-xs text-gray-500 italic py-1">Repos / Pas de colle</p>`;
            } else {
              collesOfW.forEach((c) => {
                collesHTML += `
                                <div class="bg-gray-900/80 p-2 rounded-lg border border-gray-800 text-xs flex justify-between items-center">
                                    <div>
                                        <div class="font-bold text-indigo-300">${c.sub}</div>
                                        <div class="text-gray-400 text-[11px]">${c.prof} ${c.room ? "(" + c.room + ")" : ""}</div>
                                    </div>
                                    <span class="bg-indigo-950 text-indigo-200 px-2 py-1 rounded text-[10px] font-mono border border-indigo-800">${c.slot}</span>
                                </div>
                            `;
              });
            }

            semesterGrid.innerHTML += `
                        <div class="bg-gray-900/50 p-4 rounded-xl border border-gray-800/80 space-y-2">
                            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                                <span class="font-bold text-sm text-white">Semaine ${w}</span>
                                <span class="text-[11px] text-gray-400 font-mono">${weeksDates[w]}</span>
                            </div>
                            <div class="space-y-1.5">
                                ${collesHTML}
                            </div>
                        </div>
                    `;

            // Intervalles Vacances
            if (w === 5) {
              semesterGrid.innerHTML += `
                            <div class="col-span-1 md:col-span-2 lg:col-span-3 bg-amber-950/30 border border-amber-800/40 rounded-xl p-3 text-center text-amber-300 text-xs font-semibold">
                                🍂 Vacances de la Toussaint (19/10 - 31/10)
                            </div>
                        `;
            } else if (w === 12) {
              semesterGrid.innerHTML += `
                            <div class="col-span-1 md:col-span-2 lg:col-span-3 bg-blue-950/30 border border-blue-800/40 rounded-xl p-3 text-center text-blue-300 text-xs font-semibold">
                                🎄 Vacances de Noël (21/12 - 02/01)
                            </div>
                        `;
            }
          }
        }
      }

      function downloadPNG(elementId, filenamePrefix) {
        const element = document.getElementById(elementId);
        const group = groupSelect.value;
        const week = weekSelect.value;

        html2canvas(element, {
          backgroundColor: "#030712", // Fond sombre propre pour le rendu PNG
          scale: 2,
        }).then((canvas) => {
          const link = document.createElement("a");
          link.download = `${filenamePrefix}_G${group}_${filenamePrefix === "Colle_Semaine" ? "S" + week : "S1_Complet"}.png`;
          link.href = canvas.toDataURL("image/png");
          link.click();
        });
      }

      // Lancement initial
      renderView();
    </script>
  </body>
</html>
